# Calls Mannon's background jobs on a schedule. See docs/scheduled-jobs.md.
#
# Does nothing until the repository secret CRON_SECRET is set (Settings >
# Secrets and variables > Actions) to the same value as the app's CRON_SECRET.
# The secret travels in a header over HTTPS, never in the URL.
name: Scheduled jobs

on:
  schedule:
    - cron: "7 * * * *"    # hourly
    - cron: "17 6 * * *"   # daily, 06:17 UTC
    - cron: "23 7 * * 1"   # weekly, Monday 07:23 UTC
  workflow_dispatch:
    inputs:
      group:
        description: Which jobs to run now
        type: choice
        default: hourly
        options: [hourly, daily, weekly]

permissions: {}

concurrency:
  group: scheduled-jobs-${{ github.event.schedule || inputs.group }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_URL: ${{ vars.APP_URL || 'https://manosh.fly.dev' }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      SCHEDULE: ${{ github.event.schedule }}
      GROUP: ${{ inputs.group }}
    steps:
      - name: Call the jobs
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::notice::CRON_SECRET is not set for this repository; nothing was called."
            exit 0
          fi
          case "${GROUP:-$SCHEDULE}" in
            hourly|"7 * * * *")  jobs="quote-expiry followups accounting erp" ;;
            daily|"17 6 * * *")  jobs="reminders payment-reminders tax-reminders analytics" ;;
            weekly|"23 7 * * 1") jobs="reorder-push" ;;
            *) echo "::error::Unknown trigger '${GROUP:-$SCHEDULE}'"; exit 1 ;;
          esac
          failed=""
          for job in $jobs; do
            code=$(curl -sS -o body.txt -w "%{http_code}" --max-time 180 -X POST \
              -H "x-cron-secret: $CRON_SECRET" "$APP_URL/internal/cron/$job" || echo "000")
            echo "$job -> HTTP $code $(head -c 300 body.txt 2>/dev/null)"
            [ "$code" = "200" ] || failed="$failed $job"
          done
          if [ -n "$failed" ]; then
            echo "::error::Failed:$failed"
            exit 1
          fi
