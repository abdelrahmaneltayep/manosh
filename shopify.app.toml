# Mannon — Shopify app configuration.
# client_id is filled in by `shopify app config link` against your Partner app.
# Confirm current webhook api_version + scope names via the Shopify Dev MCP.

client_id = ""
name = "Mannon"
application_url = "https://example.com"
embedded = true

[access_scopes]
# Minimum core-path scopes. Each is justified in /docs/compliance.md with its
# consuming slice. `write_draft_orders` also grants read, so no separate
# read_draft_orders scope is requested.
scopes = "read_products,read_orders,write_draft_orders,read_companies,read_payment_terms,read_inventory,write_customers"

[auth]
redirect_urls = [
  "https://example.com/auth/callback",
  "https://example.com/auth/shopify/callback",
  "https://example.com/api/auth/callback"
]

[webhooks]
api_version = "2025-01"

  # Handled by: /app/routes/webhooks.app.uninstalled.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = ["app/uninstalled"]

  # Handled by: /app/routes/webhooks.app.scopes_update.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = ["app/scopes_update"]

  # GDPR mandatory-compliance webhooks (see /docs/compliance.md). All
  # HMAC-verified before any handler logic runs.
  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/data_request"
  compliance_topics = ["customers/data_request"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/redact"
  compliance_topics = ["customers/redact"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/shop/redact"
  compliance_topics = ["shop/redact"]

[pos]
embedded = false
