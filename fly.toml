# Fly.io config for the Mannon app.
# primary_region "fra" (Frankfurt) — a good default for the Middle East. Move it
# later with `fly regions set` if most merchants are elsewhere (e.g. "iad" US).
app = "manosh"
primary_region = "fra"

[build]

[deploy]
  # Run Prisma migrations on every release, before the new version goes live.
  release_command = "npx prisma migrate deploy"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # Keep one machine warm so the embedded admin app always loads instantly (no
  # cold-start hiccup for merchants or App Store reviewers).
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
