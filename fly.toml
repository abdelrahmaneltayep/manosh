# Fly.io config for the Mannon app.
# primary_region "fra" (Frankfurt) — a good default for the Middle East. Move it
# later with `fly regions set` if most merchants are elsewhere (e.g. "iad" US).
app = "manosh"
primary_region = "fra"

[build]

# Feature flags (non-secret config, so they live here — NOT in `fly secrets`).
# Every flag-gated feature route 404s (→ App Bridge "Something went wrong") when
# its flag is unset, and the nav only links to enabled features. These are the
# full production feature set for the App Store listing, so they are all on.
# To ship a feature dark, flip its value to "false" here and redeploy.
[env]
  MANNON_FF_PLAN_V3 = "true"
  MANNON_FF_AI_QUOTE = "true"
  MANNON_FF_MAKE_AN_OFFER = "true"
  MANNON_FF_CREDIT = "true"
  MANNON_FF_PRICELISTS = "true"
  MANNON_FF_ORDERPAD = "true"
  MANNON_FF_COMPANY_ACCOUNTS = "true"
  MANNON_FF_WHOLESALE_REG = "true"
  MANNON_FF_QUOTE_ANALYTICS = "true"
  MANNON_FF_FOLLOWUPS = "true"
  MANNON_FF_MOQ = "true"
  MANNON_FF_ACCOUNTING_SYNC = "true"
  MANNON_FF_CUSTOM_CATALOGS = "true"
  MANNON_FF_REP_PORTAL = "true"
  MANNON_FF_FLEX_PAY = "true"
  MANNON_FF_TAX_VAT = "true"
  MANNON_FF_ERP_SYNC = "true"
  MANNON_FF_I18N = "true"
  MANNON_FF_QUOTE_WIDGET = "true"
  MANNON_FF_QUOTE_CAPTURE = "true"
  MANNON_FF_QUOTE_OPS = "true"
  MANNON_FF_BUYER_PWA = "true"
  MANNON_FF_CATALOG_SHARE = "true"
  MANNON_FF_WHITE_LABEL = "true"

[deploy]
  # Run Prisma migrations on every release, before the new version goes live.
  # Retry a few times: the Neon compute auto-suspends when idle, and the first
  # connection after a cold start can time out (P1001). Retrying gives the DB
  # time to wake so a transient cold start doesn't abort the whole deploy.
  release_command = "sh -c 'for i in 1 2 3 4 5 6; do npx prisma migrate deploy && exit 0; echo migrate attempt $i failed, waiting for DB; sleep 10; done; exit 1'"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # Keep one machine warm so the embedded admin app always loads instantly (no
  # cold-start hiccup for merchants or App Store reviewers).
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
