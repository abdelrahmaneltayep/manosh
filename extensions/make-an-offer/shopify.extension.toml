# F21 (PR-4) — Mannon "Make an Offer" theme app extension.
# Merchants add the app block from the theme editor (Online Store → Customize)
# on any product or cart section — no theme code editing. Growth = the offer is
# reviewed; Scale = the buyer can get an instant answer (auto-accept/counter).
api_version = "2025-01"

[[extensions]]
name = "Make an Offer"
handle = "make-an-offer"
type = "theme"

  [extensions.capabilities]
  block_only = true
